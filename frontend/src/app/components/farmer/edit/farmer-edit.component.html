<div class="container">
  <ng-container *ngIf="!isLoading && formConfig">
    <app-panel-layout
      [title]="formConfig.title"
      [subtitle]="formConfig.subtitle"
      [actionButtons]="formConfig.actionButtons"
      [backAction]="formConfig.backAction">
      <form [formGroup]="farmerForm" details>
        <ng-container *ngFor="let field of formConfig.fields">
          <div class="mb-4">
            <app-edit-field
              [label]="field.label"
              [type]="field.type"
              [placeholder]="field.placeholder"
              [formControlName]="field.key">
            </app-edit-field>

            <div *ngIf="farmerForm.get(field.key)?.invalid && farmerForm.get(field.key)?.touched"
                 class="text-danger error-text mt-1">
              {{ field.errorMessage }}
            </div>
          </div>
        </ng-container>

        <div *ngIf="successMessage" class="text-success mt-4 text-center info-text">
          {{ successMessage }}
        </div>
        <div *ngIf="errorMessage" class="text-danger mt-4 text-center info-text">
          {{ errorMessage }}
        </div>
      </form>
    </app-panel-layout>
  </ng-container>
</div>
