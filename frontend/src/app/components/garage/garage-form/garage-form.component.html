<form [formGroup]="form" (ngSubmit)="onSubmit()" details>
  <ng-container *ngFor="let field of formConfig?.fields || []">
    <div class="mb-4">

      <app-edit-field
        [label]="field.label"
        [type]="field.type"
        [placeholder]="field.placeholder"
        [formControlName]="field.key"
        (change)="onChangeInternal()">
      </app-edit-field>

      <div class="mt-3">
        <app-address-autocomplete
          (addressSelected)="onAddressSelectedInternal($event)">
        </app-address-autocomplete>
      </div>

      <div details class="garage-tip mb-4">
        <strong>Tip:</strong>
        Click anywhere on the map to set the location of your garage.<br/>
        You can drag the marker to adjust its exact position.
      </div>

      <div *ngIf="form.get(field.key)?.invalid && form.get(field.key)?.touched"
           class="text-danger error-text mt-1">
        {{ field.errorMessage }}
      </div>

    </div>
  </ng-container>

  <div *ngIf="successMessage" class="text-success mt-4 text-center info-text">
    {{ successMessage }}
  </div>
  <div *ngIf="errorMessage" class="text-danger mt-4 text-center info-text">
    {{ errorMessage }}
  </div>
</form>
