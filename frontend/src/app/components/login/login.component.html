<div class="flex-grow-1">
  <div class="row h-100">
    <div class="col-lg-8 col-md-5 col-sm-4 bg-secondary left d-flex flex-column">
      <img src="assets/images/farming.png" alt="farming background">
    </div>
    <div class="side-container col-lg-4 col-md-7 col-sm-8 bg-light right d-flex flex-column">
      <h2>Login</h2>

      <form [formGroup]="loginForm" (ngSubmit)="loginUser()">

        <div class="mt-3">
          <app-edit-field
            label="E-Mail"
            type="text"
            placeholder="Enter your E-Mail"
            formControlName="email"
          ></app-edit-field>
          <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
               class="text-danger">
            E-Mail is required.
          </div>
        </div>

        <div class="mt-3">
          <app-edit-field
            label="Password"
            type="password"
            placeholder="Enter your password"
            formControlName="password"
          ></app-edit-field>
          <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
               class="text-danger">
            Password is required.
          </div>
        </div>
        <button
          class="optiFarm-button primary mt-4"
          type="submit">
         Login
        </button>
      </form>
      <div *ngIf="errorMessage" class="text-danger mt-4">
        {{ errorMessage }}
      </div>
      <div class="mt-3">
        <p>Don't have an account? <a routerLink="/signup">Sign up</a></p>
      </div>
    </div>
  </div>
</div>
