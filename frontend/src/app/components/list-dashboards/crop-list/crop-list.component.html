<app-entity-list
  [config]="config"
  [columns]="columns"
  [rows]="rows"
  hideAdd="true"
  hideDelete="true"
  hideEdit="true"
  (sortChange)="onSortChange($event)"
></app-entity-list>
<mat-paginator
  [length]="totalElements"
  [pageSize]="pageSize"
  [pageIndex]="pageIndex"
  (page)="onMatPage($event)">
</mat-paginator>
