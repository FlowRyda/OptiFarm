name: CI Pipline

on:
  pull_request:
  push:
    branches:
    - main 

permissions:
  contents: read

jobs:
  backend:
    name: Backend Maven Verify
    runs-on: ubuntu-lasest

    defaults:
      run:
        working-directory: backend
    
    steps: 
    - name: Checkout respository
      uses: actions/checkout@v4
    
    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21
        cache: maven

    - name: Run backend verification
      run: mvn -B -Dgit.commit.id.skip=true verify
  frontend:
    name: Frontend (Lint, Test, Build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Run frontend lint
        run: npm run lint

      - name: Run frontend tests
        run: npm test -- --watch=false --browsers=ChromeHeadlessNoSandbox

      - name: Build frontend production bundle
        run: npm run build -- --configuration production
  
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t optifarm-backend:${{ github.sha }} ./backend

      - name: Build frontend Docker image
        run: docker build -t optifarm-frontend:${{ github.sha }} ./frontend




