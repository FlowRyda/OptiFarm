name: CI Pipeline

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout full Git history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan changed commits
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

      - name: Scan full Git history
        run: gitleaks git . --log-opts="--all" --redact=100
  
  backend:
    name: Backend Maven Verify
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend
        
    steps: 
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21
        cache: maven

    - name: Run backend verification
      run: mvn -B -Dgit.commit.id.skip=true verify

  frontend:
    name: Frontend (Lint, Test, Build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Run frontend lint
        run: npm run lint

      - name: Run frontend tests
        run: npm test -- --watch=false --browsers=ChromeHeadlessNoSandbox

      - name: Build frontend production bundle
        run: npm run build -- --configuration production

  terraform:
    name: Terraform Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.3
      - run: terraform fmt -check -recursive
        working-directory: infra
      - run: terraform init -backend=false && terraform validate
        working-directory: infra
  
  docker-build:
    name: Docker Build and Publish
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
      - gitleaks

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t optifarm-backend:${{ github.sha }} --label org.opencontainers.image.source=https://github.com/FlowRyda/OptiFarm ./backend

      - name: Build frontend Docker image
        run: docker build -t optifarm-frontend:${{ github.sha }} --label org.opencontainers.image.source=https://github.com/FlowRyda/OptiFarm ./frontend

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish backend Docker image
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          docker tag optifarm-backend:${{ github.sha }} ghcr.io/flowryda/optifarm-backend:${{ github.sha }}
          docker push ghcr.io/flowryda/optifarm-backend:${{ github.sha }}

      - name: Publish frontend Docker image
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          docker tag optifarm-frontend:${{ github.sha }} ghcr.io/flowryda/optifarm-frontend:${{ github.sha }}
          docker push ghcr.io/flowryda/optifarm-frontend:${{ github.sha }}
