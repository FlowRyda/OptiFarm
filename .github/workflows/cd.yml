name: CD pipeline
on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main]
  workflow_dispatch:


permissions:
    contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')

    concurrency:
      group: deploy
      cancel-in-progress: false

    permissions:
      contents: read
      packages: read

    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
            ref: ${{ env.DEPLOY_SHA }}

      - name: Prepare SSH
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_HOST_KEY: ${{ secrets.VM_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VM_HOST_KEY" > ~/.ssh/known_hosts

      - name: Copy compose file to VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          scp -i ~/.ssh/deploy_key deploy/docker-compose.prod.yml deploy@$VM_HOST:/opt/optifarm/docker-compose.prod.yml

      - name: Write .env file to VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          IMAGE_TAG: ${{ env.DEPLOY_SHA }}
        run: |
          ssh -i ~/.ssh/deploy_key deploy@$VM_HOST "umask 077 && cat > /opt/optifarm/.env" <<EOF
          POSTGRES_USER=$POSTGRES_USER
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          POSTGRES_DB=$POSTGRES_DB
          JWT_SECRET=$JWT_SECRET
          IMAGE_TAG=$IMAGE_TAG
          EOF

      - name: remote GHCR Login
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          GHCR_TOKEN: ${{ secrets.GHCR_PAT }}
        run: |
          ssh -i ~/.ssh/deploy_key deploy@$VM_HOST "docker login ghcr.io -u FlowRyda --password-stdin" <<< "$GHCR_TOKEN"

      - name: Deploy to VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key deploy@$VM_HOST "cd /opt/optifarm && docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d"

      - name: Health Check
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          echo "Checking frontend..."
          curl --fail --silent --show-error \
            --retry 12 --retry-delay 5 --retry-connrefused \
            -o /dev/null http://$VM_HOST/

          echo "Checking backend through nginx..."
          for i in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              -H 'Content-Type: application/json' \
              -d '{"email":"healthcheck@invalid","password":"x"}' \
              http://$VM_HOST/api/v1/authentication || true)
            if [ "$code" = "401" ]; then
              echo "Backend is up (received 401 for the bad login, as expected)"
              exit 0
            fi
            echo "Attempt $i: got '$code', retrying in 5s"
            sleep 5
          done
          echo "Backend did not come up in time"
          exit 1

      - name: Show container status and logs on failure
        if: failure()
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key deploy@$VM_HOST "cd /opt/optifarm && docker compose -f docker-compose.prod.yml ps && docker compose -f docker-compose.prod.yml logs --tail=100"