name: CD pipeline
on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main]
  workflow_dispatch:


permissions:
    contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  infra:
    name: Provision Infrastructure
    runs-on: ubuntu-latest
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Authenticate to GC
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.3

      - name: Derive SSH public key
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          printf '%s\n' "$VM_SSH_KEY" > "$RUNNER_TEMP/key"
          chmod 600 "$RUNNER_TEMP/key"
          echo "TF_VAR_ssh_public_key=$(ssh-keygen -y -f "$RUNNER_TEMP/key") optifarm-deploy" >> $GITHUB_ENV
          rm "$RUNNER_TEMP/key"

      - name: Terraform init
        working-directory: infra
        run: terraform init -input=false

      - name: Terraform apply
        working-directory: infra
        run: terraform apply -auto-approve -input=false

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: infra
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
            ref: ${{ env.DEPLOY_SHA }}

      - name: Prepare SSH
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_HOST_KEY: ${{ secrets.VM_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VM_HOST_KEY" > ~/.ssh/known_hosts

      - name: Wait for VM to be ready
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          for i in $(seq 1 30); do
          if ssh -i ~/.ssh/deploy_key -o ConnectTimeout=5 deploy@$VM_HOST "docker info >/dev/null 2>&1 && test -d /opt/optifarm"; then
            echo "VM is ready"; exit 0
          fi
          echo "Attempt $i: VM not ready, retrying in 10"; sleep 10
          done
          echo "VM did not become ready in time"; exit 1

      - name: Copy compose file to VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          scp -i ~/.ssh/deploy_key deploy/docker-compose.prod.yml deploy@$VM_HOST:/opt/optifarm/docker-compose.prod.yml

      - name: Write .env file to VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          IMAGE_TAG: ${{ env.DEPLOY_SHA }}
        run: |
          ssh -i ~/.ssh/deploy_key deploy@$VM_HOST "umask 077 && cat > /opt/optifarm/.env" <<EOF
          POSTGRES_USER=$POSTGRES_USER
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          POSTGRES_DB=$POSTGRES_DB
          JWT_SECRET=$JWT_SECRET
          IMAGE_TAG=$IMAGE_TAG
          EOF

      - name: remote GHCR Login
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh -i ~/.ssh/deploy_key deploy@$VM_HOST "docker login ghcr.io -u FlowRyda --password-stdin" <<< "$GHCR_TOKEN"

      - name: Deploy to VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key deploy@$VM_HOST "cd /opt/optifarm && docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d"

      - name: Health Check
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          echo "Checking frontend..."
          curl --fail --silent --show-error \
            --retry 12 --retry-delay 5 --retry-connrefused \
            -o /dev/null http://$VM_HOST/

          echo "Checking backend through nginx..."
          for i in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              -H 'Content-Type: application/json' \
              -d '{"email":"healthcheck@invalid","password":"x"}' \
              http://$VM_HOST/api/v1/authentication || true)
            if [ "$code" = "401" ]; then
              echo "Backend is up (received 401 for the bad login, as expected)"
              exit 0
            fi
            echo "Attempt $i: got '$code', retrying in 5s"
            sleep 5
          done
          echo "Backend did not come up in time"
          exit 1

      - name: Show container status and logs on failure
        if: failure()
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key deploy@$VM_HOST "cd /opt/optifarm && docker compose -f docker-compose.prod.yml ps && docker compose -f docker-compose.prod.yml logs --tail=100"